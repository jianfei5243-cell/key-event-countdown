<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关键事件倒计时定时器</title>
<style>
/* ============================================
   CSS Variables — 6 Themes
   ============================================ */
[data-theme="midnight"] {
  --bg-primary: #0b0d1a;
  --bg-secondary: #11142b;
  --bg-card: rgba(255,255,255,0.03);
  --bg-card-hover: rgba(255,255,255,0.06);
  --bg-input: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14);
  --text-primary: #e8e8ed;
  --text-secondary: #9ca3af;
  --text-dim: #6b7280;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --accent-glow: rgba(99,102,241,0.25);
  --danger: #ef4444;
  --warn: #f59e0b;
  --safe: #22c55e;
  --sidebar-bg: #0a0c16;
  --glow1: rgba(99,102,241,0.10);
  --glow2: rgba(139,92,246,0.08);
  --ring-track: rgba(255,255,255,0.06);
}
[data-theme="purple"] {
  --bg-primary: #120c1e; --bg-secondary: #1a132b;
  --bg-card: rgba(255,255,255,0.03); --bg-card-hover: rgba(255,255,255,0.06);
  --bg-input: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14); --text-primary: #e8dff5;
  --text-secondary: #b09cc7; --text-dim: #7a6b93;
  --accent: #a855f7; --accent2: #c084fc; --accent-glow: rgba(168,85,247,0.25);
  --danger: #f87171; --warn: #fbbf24; --safe: #4ade80;
  --sidebar-bg: #0f0918; --glow1: rgba(168,85,247,0.10); --glow2: rgba(192,132,252,0.08);
  --ring-track: rgba(255,255,255,0.06);
}
[data-theme="forest"] {
  --bg-primary: #0a1712; --bg-secondary: #0f1f1a;
  --bg-card: rgba(255,255,255,0.03); --bg-card-hover: rgba(255,255,255,0.06);
  --bg-input: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14); --text-primary: #d1f0e0;
  --text-secondary: #86b8a0; --text-dim: #5c8a74;
  --accent: #10b981; --accent2: #34d399; --accent-glow: rgba(16,185,129,0.25);
  --danger: #f87171; --warn: #fbbf24; --safe: #22c55e;
  --sidebar-bg: #07120e; --glow1: rgba(16,185,129,0.10); --glow2: rgba(52,211,153,0.08);
  --ring-track: rgba(255,255,255,0.06);
}
[data-theme="sunset"] {
  --bg-primary: #1a130e; --bg-secondary: #241a14;
  --bg-card: rgba(255,255,255,0.04); --bg-card-hover: rgba(255,255,255,0.08);
  --bg-input: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.16); --text-primary: #f5e6d8;
  --text-secondary: #c4a88c; --text-dim: #8b7355;
  --accent: #f97316; --accent2: #fb923c; --accent-glow: rgba(249,115,22,0.25);
  --danger: #ef4444; --warn: #eab308; --safe: #22c55e;
  --sidebar-bg: #14100a; --glow1: rgba(249,115,22,0.10); --glow2: rgba(251,146,60,0.08);
  --ring-track: rgba(255,255,255,0.06);
}
[data-theme="ocean"] {
  --bg-primary: #0c1929; --bg-secondary: #12223b;
  --bg-card: rgba(255,255,255,0.03); --bg-card-hover: rgba(255,255,255,0.06);
  --bg-input: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.14); --text-primary: #d0e4f5;
  --text-secondary: #8bb9d9; --text-dim: #5b8aa6;
  --accent: #0ea5e9; --accent2: #38bdf8; --accent-glow: rgba(14,165,233,0.25);
  --danger: #f87171; --warn: #fbbf24; --safe: #4ade80;
  --sidebar-bg: #091420; --glow1: rgba(14,165,233,0.10); --glow2: rgba(56,189,248,0.08);
  --ring-track: rgba(255,255,255,0.06);
}
[data-theme="light"] {
  --bg-primary: #f8fafc; --bg-secondary: #ffffff;
  --bg-card: rgba(0,0,0,0.02); --bg-card-hover: rgba(0,0,0,0.04);
  --bg-input: rgba(0,0,0,0.02); --border: rgba(0,0,0,0.06);
  --border-hover: rgba(0,0,0,0.12); --text-primary: #1e293b;
  --text-secondary: #64748b; --text-dim: #94a3b8;
  --accent: #6366f1; --accent2: #8b5cf6; --accent-glow: rgba(99,102,241,0.15);
  --danger: #ef4444; --warn: #f59e0b; --safe: #22c55e;
  --sidebar-bg: #f1f5f9; --glow1: rgba(99,102,241,0.04); --glow2: rgba(139,92,246,0.03);
  --ring-track: rgba(0,0,0,0.06);
}
[data-theme="cyberpunk"] {
  --bg-primary: #0a0a0f;
  --bg-secondary: #0f0f1a;
  --bg-card: rgba(0, 240, 255, 0.04);
  --bg-card-hover: rgba(0, 240, 255, 0.08);
  --bg-input: rgba(0, 240, 255, 0.05);
  --border: rgba(0, 240, 255, 0.12);
  --border-hover: rgba(0, 240, 255, 0.30);
  --text-primary: #d4f4ff;
  --text-secondary: #7ec8e3;
  --text-dim: #3a7a94;
  --accent: #00f0ff;
  --accent2: #ff00ff;
  --accent-glow: rgba(0, 240, 255, 0.30);
  --danger: #ff3366;
  --warn: #ffe600;
  --safe: #00ff88;
  --sidebar-bg: #06060d;
  --glow1: rgba(0, 240, 255, 0.08);
  --glow2: rgba(255, 0, 255, 0.06);
  --ring-track: rgba(0, 240, 255, 0.08);
}

/* Cyberpunk scanline overlay */
[data-theme="cyberpunk"] body::after {
  content: '';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
  );
}

/* Cyberpunk neon glow effects */
[data-theme="cyberpunk"] .sidebar-logo {
  text-shadow: 0 0 10px var(--accent), 0 0 30px var(--accent), 0 0 50px var(--accent2);
  animation: cyber-pulse 2s ease-in-out infinite;
}
[data-theme="cyberpunk"] .project-item.active::before {
  box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent);
}
[data-theme="cyberpunk"] .project-item.active {
  box-shadow: inset 0 0 20px rgba(0,240,255,0.05);
}
[data-theme="cyberpunk"] .btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: 1px solid var(--accent);
  box-shadow: 0 0 12px var(--accent-glow), 0 0 24px rgba(255,0,255,0.15);
}
[data-theme="cyberpunk"] .btn-primary:hover {
  box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(255,0,255,0.25);
  transform: translateY(-1px);
}
[data-theme="cyberpunk"] .btn-danger {
  box-shadow: 0 0 10px rgba(255,51,102,0.2);
}
[data-theme="cyberpunk"] .event-card {
  border: 1px solid var(--border);
  transition: all 0.3s;
}
[data-theme="cyberpunk"] .event-card:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px var(--accent-glow), inset 0 0 20px rgba(0,240,255,0.03);
}
[data-theme="cyberpunk"] .event-card.past {
  border-color: rgba(255,51,102,0.3);
  box-shadow: inset 0 0 20px rgba(255,51,102,0.05);
}
[data-theme="cyberpunk"] .countdown-unit {
  border: 1px solid var(--border);
  box-shadow: 0 0 6px rgba(0,240,255,0.10);
}
[data-theme="cyberpunk"] .countdown-num {
  text-shadow: 0 0 8px var(--accent);
}
[data-theme="cyberpunk"] .project-title-input {
  text-shadow: 0 0 6px rgba(0,240,255,0.2);
}
[data-theme="cyberpunk"] .project-title-input:focus {
  border-bottom-color: var(--accent);
  box-shadow: 0 2px 8px var(--accent-glow);
}
[data-theme="cyberpunk"] .modal {
  border: 1px solid rgba(0,240,255,0.2);
  box-shadow: 0 0 30px rgba(0,240,255,0.1), 0 0 60px rgba(255,0,255,0.05);
}
[data-theme="cyberpunk"] textarea:focus, [data-theme="cyberpunk"] input:focus, [data-theme="cyberpunk"] select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}
[data-theme="cyberpunk"] .mini-btn:hover, [data-theme="cyberpunk"] .mini-btn-icon:hover {
  border-color: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow);
}
[data-theme="cyberpunk"] .toast {
  background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(255,0,255,0.10));
  border: 1px solid rgba(0,240,255,0.3);
  box-shadow: 0 0 20px rgba(0,240,255,0.15);
}
[data-theme="cyberpunk"] .add-project-btn:hover {
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}
[data-theme="cyberpunk"] .sidebar {
  border-right: 1px solid rgba(0,240,255,0.08);
}

@keyframes cyber-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.85; }
}


/* ============================================
   Base & Reset
   ============================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s, color 0.3s;
}
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
  transition: background 0.3s;
}
body::before { top: -30%; left: -10%; width: 70%; height: 70%; background: radial-gradient(ellipse, var(--glow1) 0%, transparent 70%); }
body::after  { bottom: -20%; right: -5%; width: 60%; height: 60%; background: radial-gradient(ellipse, var(--glow2) 0%, transparent 70%); }

/* ============================================
   Layout
   ============================================ */
.app-layout {
  position: relative; z-index: 1;
  display: flex; height: 100vh;
}

/* ============================================
   Sidebar
   ============================================ */
.sidebar {
  width: 260px; min-width: 260px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 28px 16px 16px;
  transition: background 0.3s, border 0.3s;
  overflow-y: auto;
}
.sidebar-logo {
  font-size: 1.1rem; font-weight: 750;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 8px; padding: 0 8px; user-select: none; letter-spacing: -0.01em;
}
.sidebar-subtitle {
  font-size: 0.7rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 0 8px; margin-bottom: 24px;
}
.sidebar-scroll-area {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
}
.project-list {
  display: flex; flex-direction: column; gap: 4px;
}
.project-list-header {
  font-size: 0.68rem; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;
  padding: 4px 8px 12px;
}
.project-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  transition: all 0.2s; font-size: 0.88rem; font-weight: 500;
  color: var(--text-secondary); position: relative;
}
.project-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.project-item.active { background: var(--bg-card); color: var(--text-primary); font-weight: 600; }
.project-item.active::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; background: var(--accent); border-radius: 0 4px 4px 0;
}
.project-item .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
}

.project-edit-btn {
  display: none; width: 22px; height: 22px; border-radius: 6px;
  border: none; background: transparent; color: var(--text-dim);
  cursor: pointer; align-items: center; justify-content: center;
  font-size: 0.7rem; flex-shrink: 0; transition: all 0.15s;
  margin-left: 2px;
}
.project-item:hover .project-edit-btn { display: inline-flex; }
.project-edit-btn:hover { background: var(--bg-input); color: var(--accent); }

.project-item .count {
  margin-left: auto; font-size: 0.7rem; color: var(--text-dim);
  background: var(--bg-input); padding: 2px 8px; border-radius: 10px;
  min-width: 22px; text-align: center;
}
.add-project-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 1px dashed var(--border); color: var(--text-dim);
  font-size: 0.82rem; font-family: inherit; background: transparent;
  width: 100%; margin-top: 8px; transition: all 0.2s;
}
.add-project-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-card); }

/* Batch mode */
.batch-toggle-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
  color: var(--text-dim); font-size: 0.78rem; font-family: inherit;
  background: transparent; width: 100%; margin-top: 8px; transition: all 0.2s;
}
.batch-toggle-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-card); }
.batch-toggle-btn.active { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.08); }

.batch-actions { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }
.batch-actions.show { display: flex; }
.batch-actions .batch-row { display: flex; gap: 6px; }
.batch-actions .batch-row button { flex: 1; }

.project-checkbox {
  display: none; width: 18px; height: 18px; border-radius: 5px;
  border: 2px solid var(--border); flex-shrink: 0; cursor: pointer;
  align-items: center; justify-content: center; transition: all 0.15s;
  font-size: 0.65rem; color: transparent;
}
.batch-mode .project-checkbox { display: flex; }
.batch-mode .project-item .dot { display: none; }
.project-checkbox.checked { border-color: var(--accent); background: var(--accent); color: #fff; }

/* Theme picker */
.theme-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.theme-section-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; padding: 0 8px 10px; }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 8px; }
.theme-dot {
  width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: all 0.2s; position: relative;
}
.theme-dot:hover { transform: scale(1.12); }
.theme-dot.active { border-color: var(--text-primary); box-shadow: 0 0 0 3px var(--accent-glow); }
.sidebar-footer {
  margin-top: auto; padding: 12px 0 0;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  position: sticky; bottom: 0;
}
.mini-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--border);
  color: var(--text-dim); font-size: 0.78rem; font-family: inherit;
  background: transparent; width: 100%; transition: all 0.2s;
}
.mini-btn:hover { border-color: var(--text-dim); color: var(--text-primary); }

/* ============================================
   Main Content
   ============================================ */
.main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 32px 36px 40px; }
.empty-project {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; color: var(--text-dim);
}
.empty-project .icon { font-size: 3.5rem; opacity: 0.3; margin-bottom: 8px; }
.empty-project h2 { font-size: 1.2rem; color: var(--text-secondary); font-weight: 600; }

.project-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
}
.project-title-area { flex: 1; min-width: 200px; }
.project-title-input {
  font-size: 1.6rem; font-weight: 700; background: transparent; border: none;
  color: var(--text-primary); outline: none; font-family: inherit; width: 100%;
  letter-spacing: -0.02em; border-bottom: 2px solid transparent; transition: border 0.2s; padding: 4px 0;
}
.project-title-input:focus { border-bottom-color: var(--accent); }
.project-title-input::placeholder { color: var(--text-dim); }
.project-event-count { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }
.project-actions { display: flex; gap: 8px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 10px; font-size: 0.85rem;
  font-weight: 600; cursor: pointer; border: none; font-family: inherit;
  transition: all 0.2s; letter-spacing: 0.01em; white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; box-shadow: 0 4px 16px var(--accent-glow);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 24px var(--accent-glow); }
.btn-ghost { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-card-hover); border-color: var(--border-hover); color: var(--text-primary); }
.btn-sm { padding: 6px 14px; font-size: 0.78rem; border-radius: 8px; }
.btn-danger { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
.btn-danger:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.5); }
.btn-icon {
  width: 34px; height: 34px; border-radius: 8px; background: transparent;
  border: 1px solid transparent; color: var(--text-dim); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.85rem; transition: all 0.2s;
}
.btn-icon:hover { background: var(--bg-card); border-color: var(--border); color: var(--text-primary); }

/* ============================================
   Events Grid
   ============================================ */
.events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

/* Event Card */
.event-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px; position: relative; overflow: hidden;
  transition: all 0.3s; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.event-card:hover {
  border-color: var(--border-hover); background: var(--bg-card-hover);
  box-shadow: 0 12px 40px rgba(0,0,0,0.3); transform: translateY(-2px);
}
.event-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; transition: background 0.5s;
}
.event-card.urgency-safe::before { background: var(--safe); }
.event-card.urgency-warn::before { background: var(--warn); }
.event-card.urgency-danger::before { background: var(--danger); }
.event-card.past::before { background: var(--text-dim); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
.event-name { font-size: 1.05rem; font-weight: 650; color: var(--text-primary); word-break: break-word; line-height: 1.4; flex: 1; }
.card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.period-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px; padding: 12px 14px;
  background: var(--accent-glow); border: 1px solid var(--accent);
  border-radius: 12px;
}
.period-banner .period-title {
  font-size: 0.72rem; font-weight: 700; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.period-banner .period-range {
  font-size: 1.08rem; font-weight: 750; color: var(--text-primary);
  font-variant-numeric: tabular-nums; word-break: break-word;
}
.period-banner .period-duration {
  margin-left: auto; font-size: 0.82rem; font-weight: 750;
  background: var(--accent); color: #fff; padding: 4px 12px;
  border-radius: 20px; white-space: nowrap; letter-spacing: 0.02em;
}
.card-top { margin-bottom: 14px; }

/* Circular Progress Ring */
.countdown-ring-wrap { display: flex; justify-content: center; margin-bottom: 18px; }
.countdown-ring { position: relative; width: 140px; height: 140px; }
.ring-svg { transform: rotate(-90deg); width: 140px; height: 140px; }
.ring-track { fill: none; stroke: var(--ring-track); stroke-width: 8; }
.ring-progress { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease, stroke 1s; }
.urgency-safe .ring-progress { stroke: var(--safe); }
.urgency-warn .ring-progress { stroke: var(--warn); }
.urgency-danger .ring-progress { stroke: var(--danger); }
.past .ring-progress { stroke: var(--text-dim); }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-center .big-num { font-size: 2rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.urgency-safe .big-num { color: var(--safe); }
.urgency-warn .big-num { color: var(--warn); }

<script>
// ============================================
// DATA STORE
// ============================================
const STORAGE_KEY = 'countdown_timer_v2';
const THEME_KEY = 'countdown_timer_theme';

let appData = { projects: [], activeProjectId: null };
let editingEventId = null;
let batchMode = false;
let selectedProjects = new Set();
let expandedMiniSections = new Set();
let isShareMode = false;
let lastSaveTime = Date.now();

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function loadData() {
  if (isShareMode) return; // Don't load from localStorage in share mode
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      appData.projects = d.projects || [];
      appData.activeProjectId = d.activeProjectId || null;
      appData.projects.forEach(p => { if (!p.events) p.events = []; p.events.forEach(normalizeEvent); });
    }
  } catch(e) { appData = { projects: [], activeProjectId: null }; }

  if (appData.projects.length === 0) {
    const p = { id: uid(), name: '我的项目', events: [] };
    appData.projects.push(p);
    appData.activeProjectId = p.id;
  }
  if (!appData.projects.find(p => p.id === appData.activeProjectId)) {
    appData.activeProjectId = appData.projects[0].id;
  }
}

function saveData() {
  if (isShareMode) return; // Don't persist in share mode
  lastSaveTime = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    projects: appData.projects,
    activeProjectId: appData.activeProjectId,
    _ts: lastSaveTime
  }));
}

function getActive() { return appData.projects.find(p => p.id === appData.activeProjectId); }

// ============================================
// THEME
// ============================================
function setTheme(name) {
  document.body.setAttribute('data-theme', name);
  localStorage.setItem(THEME_KEY, name);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === name));
}
function loadTheme() { setTheme(localStorage.getItem(THEME_KEY) || 'midnight'); }

// ============================================
// RENDER
// ============================================
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderSidebar() {
  document.getElementById('projectList').innerHTML = appData.projects.map(p => `
    <div class="project-item${p.id === appData.activeProjectId ? ' active' : ''}" data-pid="${p.id}">
      <div class="project-checkbox${selectedProjects.has(p.id) ? ' checked' : ''}" data-pid="${p.id}">✓</div>
      <span class="dot"></span><span>${esc(p.name)}</span><button class="project-edit-btn" onclick="event.stopPropagation(); openRenameProjectModal('${p.id}')" title="重命名项目">✏️</button><span class="count">${p.events.length}</span>
    </div>
  `).join('');
  // Toggle batch class on sidebar
  document.querySelector('.sidebar').classList.toggle('batch-mode', batchMode);
  document.getElementById('batchActions').classList.toggle('show', batchMode);
  document.getElementById('addProjectBtn').style.display = batchMode ? 'none' : '';
  document.getElementById('batchToggleBtn').classList.toggle('active', batchMode);
  document.getElementById('batchToggleBtn').innerHTML = batchMode ? '✕ 退出批量管理' : '☑ 批量管理';
}

function renderMain() {
  const project = getActive();
  const main = document.getElementById('mainContent');
  if (!project) { main.innerHTML = '<div class="empty-project"><div class="icon">📋</div><h2>选择一个项目</h2></div>'; return; }

  const isMini = document.body.classList.contains('mini-mode');

  if (isMini) {
    // Mini mode: show all projects as collapsible sections
    const allEventsHtml = appData.projects.map(p => {
      const sectionEvents = p.events.length > 0
        ? p.events.map(ev => card(ev)).join('')
        : '<div class="mini-empty">暂无事件</div>';
      const isExpanded = expandedMiniSections.has(p.id);
      return `
        <div class="mini-project-section">
          <div class="mini-project-section-header${isExpanded ? ' open' : ''}" onclick="toggleMiniSection(this)" data-pid="${p.id}">
            <span class="dot"></span>
            <span class="name">${esc(p.name)}</span>
            <span class="count">${p.events.length}</span>
            <button class="mini-btn-icon" style="width:26px;height:26px;font-size:0.8rem;margin-right:6px" onclick="event.stopPropagation(); addEventToProject('${p.id}')" title="添加事件到该项目">＋</button>
            <span class="arrow">▼</span>
          </div>
          <div class="mini-project-section-body${isExpanded ? ' show' : ''}">${sectionEvents}</div>
        </div>`;
    }).join('');

    main.innerHTML = `
      <div class="mini-header">
        <span class="header-title">⏳ 关键事件倒计时</span>
        <button class="mini-btn-icon" id="miniAddProjectBtn" title="添加项目">📁</button>

function urgency(dl) {
  const d = new Date(dl).getTime() - Date.now();
  if (d < 0) return 'past';
  if (d < 3600000) return 'danger';
  if (d < 86400000) return 'warn';
  return 'safe';
}

function cd(deadline) {
  const diff = new Date(deadline).getTime() - Date.now();
  if (diff <= 0) return { days:0, hours:0, mins:0, secs:0, past:true };
  const s = Math.floor(diff / 1000);
  return { days: Math.floor(diff/86400000), hours: Math.floor((diff%86400000)/3600000), mins: Math.floor((diff%3600000)/60000), secs: Math.floor((diff%60000)/1000), past:false };
}

function toLocalInput(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Determine current status of a test period event
function eventStatus(ev) {
  const now = Date.now();
  const st = new Date(ev.start).getTime();
  const et = new Date(ev.end).getTime();
  if (now < st) return 'upcoming';
  if (now <= et) return 'active';
  return 'past';
}

// Migrate legacy events (deadline/cycle) to start/end period model
function normalizeEvent(ev) {
  if (!ev.start || !ev.end) {
    if (ev.deadline) {
      ev.end = ev.deadline;
      const d = new Date(ev.deadline);
      d.setHours(0, 0, 0, 0);
      ev.start = toLocalInput(d);
    } else {
      const n = Date.now();
      ev.start = toLocalInput(new Date(n));
      ev.end = toLocalInput(new Date(n + 86400000));
    }
  }
  delete ev.deadline;
  delete ev.cycle;
  return ev;
}

function fmtDT(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function fmtRem(m) {
  if (!m||m==0) return '不提醒';
  if (m<60) return `提前 ${m} 分钟`;
  if (m<1440) return `提前 ${m/60} 小时`;
  return `提前 ${m/1440} 天`;
}
function fmtDuration(start, end) {
  const diff = new Date(end).getTime() - new Date(start).getTime();
  if (diff <= 0) return '0 天';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  if (days > 0) return hours > 0 ? `${days} 天 ${hours} 小时` : `${days} 天`;
  return hours > 0 ? `${hours} 小时` : '不足 1 小时';
}

function ring(dl) {
  const diff = new Date(dl).getTime() - Date.now();
  const f = Math.max(0, Math.min(1, diff/(7*86400000)));
  const c = 2*Math.PI*60;
  return { f, offset: c*(1-f), circ: c };
}

function card(ev) {
  const status = eventStatus(ev);
  const past = status === 'past';
  const active = status === 'active';
  const target = status === 'upcoming' ? ev.start : ev.end;
  const c = past ? { days:0, hours:0, mins:0, secs:0, past:true } : cd(target);
  const u = past ? 'past' : urgency(target);
  const r = ring(target);

  const ringCenterLabel = past ? '已结束' : (active ? '距结束' : '距开始');
  const ringBig = past ? '—' : c.days;

  const ringH = past ? `
    <div class="countdown-ring-wrap"><div class="countdown-ring">
      <svg class="ring-svg" viewBox="0 0 140 140">
        <circle class="ring-track" cx="70" cy="70" r="60"/>
        <circle class="ring-progress" cx="70" cy="70" r="60" stroke-dasharray="${r.circ}" stroke-dashoffset="${r.circ}" opacity="0.3"/>
      </svg>
      <div class="ring-center"><div class="big-num" style="color:var(--text-dim)">—</div><div class="big-label">已结束</div></div>
    </div></div>` : `
    <div class="countdown-ring-wrap"><div class="countdown-ring">
      <svg class="ring-svg" viewBox="0 0 140 140">
        <circle class="ring-track" cx="70" cy="70" r="60"/>
        <circle class="ring-progress" cx="70" cy="70" r="60" stroke-dasharray="${r.circ}" stroke-dashoffset="${r.offset}"/>
      </svg>
      <div class="ring-center"><div class="big-num">${ringBig}</div><div class="big-label">${ringCenterLabel}</div></div>
    </div></div>`;

  const split = past ? `
    <div class="countdown-split">
      <div class="countdown-unit"><div class="countdown-num">—</div><div class="countdown-label">天</div></div>
      <div class="countdown-unit"><div class="countdown-num">—</div><div class="countdown-label">时</div></div>
      <div class="countdown-unit"><div class="countdown-num">—</div><div class="countdown-label">分</div></div>
      <div class="countdown-unit"><div class="countdown-num">—</div><div class="countdown-label">秒</div></div>
    </div>` : `
    <div class="countdown-split">
      <div class="countdown-unit"><div class="countdown-num">${c.days}</div><div class="countdown-label">天</div></div>
      <div class="countdown-unit"><div class="countdown-num">${String(c.hours).padStart(2,'0')}</div><div class="countdown-label">时</div></div>
      <div class="countdown-unit"><div class="countdown-num">${String(c.mins).padStart(2,'0')}</div><div class="countdown-label">分</div></div>
      <div class="countdown-unit"><div class="countdown-num">${String(c.secs).padStart(2,'0')}</div><div class="countdown-label">秒</div></div>
    </div>`;

  const statusText = past ? '✅ 已结束' : (active ? '⏳ 进行中' : '🔜 未开始');

  return `
    <div class="event-card urgency-${u}${past?' past':''}${active?' active':''}" data-eid="${ev.id}">
      <div class="card-top">
        <div class="event-name">${esc(ev.name)}</div>
        <div class="card-actions">
          <button class="btn-icon edit-btn" data-eid="${ev.id}" title="编辑">✏️</button>
          <button class="btn-icon del-btn" data-eid="${ev.id}" title="删除" style="color:var(--danger)">🗑</button>
        </div>
      </div>
      <div class="period-banner">
        <span class="period-title">📅 测试周期</span>
        <span class="period-range">${fmtDT(ev.start)} → ${fmtDT(ev.end)}</span>
        <span class="period-duration">持续 ${fmtDuration(ev.start, ev.end)}</span>
      </div>
      ${ringH}${split}
      <div class="card-footer">
        <span class="reminder-badge">🔔 ${fmtRem(ev.reminder)}</span>
        <span class="status-badge status-${status}">${statusText}</span>
      </div>
    </div>`;
}

function loadShare() {
  var hash = location.hash;
  if (!hash || hash.indexOf('#share=') !== 0) return;
  
  var encoded = hash.substring(7);
  var json;
  
  try {
    json = decodeURIComponent(encoded);
  } catch(e1) {
    try {
      var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var binary = atob(b64);
      var bytes = [];
      for (var i = 0; i < binary.length; i++) { bytes.push(binary.charCodeAt(i)); }
      json = new TextDecoder().decode(new Uint8Array(bytes));
    } catch(e2) {
      return;
    }
  }
  
  try {
    var d = JSON.parse(json);
    if (!d.projects || !Array.isArray(d.projects)) return;
    d.projects.forEach(function(p) { if (!p.events) p.events = []; p.events.forEach(normalizeEvent); });
    
    isShareMode = true;
    appData.projects = d.projects;
    appData.activeProjectId = d.activeProjectId || null;
    if (!appData.projects.find(function(p) { return p.id === appData.activeProjectId; })) {
      appData.activeProjectId = appData.projects[0] ? appData.projects[0].id : null;
    }
    
    var banner = document.getElementById('shareBanner');
    if (banner) banner.classList.add('show');
    
    var addProject = document.getElementById('addProjectBtn');
    var batchToggle = document.getElementById('batchToggleBtn');
    var batchActions = document.getElementById('batchActions');
    var shareBtn = document.getElementById('shareBtn');
    if (addProject) addProject.style.display = 'none';
    if (batchToggle) batchToggle.style.display = 'none';
    if (batchActions) batchActions.style.display = 'none';
    if (shareBtn) shareBtn.textContent = '🚫 退出分享模式';
  } catch(e) {}
}

// Hash change listener
window.addEventListener('hashchange', function() {
  if (location.hash.indexOf('#share=') === 0) {
    isShareMode = false;
    loadData();
    loadShare();

});

function batchDeleteProjects() {
  if (selectedProjects.size === 0) { toast('⚠️ 请先选择要删除的项目'); return; }
  const count = selectedProjects.size;
  const remaining = appData.projects.length - count;
  if (remaining < 1) { toast('⚠️ 至少保留一个项目'); return; }

  const names = appData.projects.filter(p => selectedProjects.has(p.id)).map(p => `「${p.name}」`).join('、');
  if (!confirm(`确定删除以下 ${count} 个项目？\n\n${names}\n\n所有项目下的事件也会被清除。此操作不可恢复！`)) return;

  appData.projects = appData.projects.filter(p => !selectedProjects.has(p.id));
  if (selectedProjects.has(appData.activeProjectId)) {
    appData.activeProjectId = appData.projects[0]?.id || null;
  }
  selectedProjects.clear();
  batchMode = false;
  saveData();
  renderAll();
  toast(`🗑 已删除 ${count} 个项目`);
}

  document.getElementById('batchSelectAllBtn').onclick = selectAllProjects;

function openEventModal(eid) {
  editingEventId = eid || null;
  document.getElementById('modalTitle').textContent = eid ? '编辑关键事件' : '添加关键事件';
  document.getElementById('modalSaveBtn').textContent = eid ? '更新' : '保存';
  document.getElementById('modalOverlay').classList.add('active');

  if (eid) {
    // Search across all projects (needed for mini mode)
    let ev = null;
    for (const p of appData.projects) {
      ev = p.events.find(e => e.id === eid);
      if (ev) { appData.activeProjectId = p.id; break; }
    }
    if (ev) {
      document.getElementById('eventNameInput').value = ev.name;
      document.getElementById('eventStartInput').value = ev.start || '';
      document.getElementById('eventEndInput').value = ev.end || '';
      document.getElementById('eventReminderInput').value = ev.reminder;
    }
  } else {
    document.getElementById('eventNameInput').value = '';
    const s = new Date(Date.now() + 3*86400000);
    const e = new Date(Date.now() + 4*86400000);
    document.getElementById('eventStartInput').value = toLocalInput(s);
    document.getElementById('eventEndInput').value = toLocalInput(e);
    document.getElementById('eventReminderInput').value = '1440';
  }
  document.getElementById('eventNameInput').focus();
}
function closeEventModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingEventId = null;
}
function saveEvent() {
  // When editing, find the correct project (needed for mini mode)
  let project = getActive();
  if (!project) return;

  if (editingEventId) {
    for (const p of appData.projects) {
      if (p.events.find(e => e.id === editingEventId)) { project = p; break; }
    }
  }
  const name = document.getElementById('eventNameInput').value.trim();
  const start = document.getElementById('eventStartInput').value;
  const end = document.getElementById('eventEndInput').value;
  const reminder = parseInt(document.getElementById('eventReminderInput').value);
  if (!name) { toast('⚠️ 请输入事件名称'); return; }
  if (!start || !end) { toast('⚠️ 请选择测试周期的开始和结束时间'); return; }
  if (end < start) { toast('⚠️ 结束时间不能早于开始时间'); return; }

  if (editingEventId) {
    const ev = project.events.find(e => e.id === editingEventId);
    if (ev) { ev.name = name; ev.start = start; ev.end = end; ev.reminder = reminder; }
  } else {
    project.events.push({ id: uid(), name, start, end, reminder });
  }
  project.events.sort((a,b) => new Date(a.start) - new Date(b.start));
  saveData(); renderAll(); closeEventModal();
  toast(editingEventId ? '✅ 事件已更新' : '✅ 事件已添加');
}
function deleteEvent(id) {
  // Search across all projects (needed for mini mode)
  let project = null;
  for (const p of appData.projects) {
    if (p.events.find(e => e.id === id)) { project = p; break; }
  }
  if (!project) return;
  const ev = project.events.find(e => e.id === id);
  if (ev && confirm(`确定删除「${ev.name}」？`)) {
    project.events = project.events.filter(e => e.id !== id);
    saveData(); renderAll(); toast('🗑 事件已删除');
  }
}

let importPendingEvents = [];

function parseExcelDate(val) {
  if (val === null || val === undefined || val === '') return '';
  if (val instanceof Date && !isNaN(val.getTime())) return toLocalInput(val);
  if (typeof val === 'number' && isFinite(val)) {
    // Excel serial date (days since 1899-12-30)
    const utc = new Date(Math.round((val - 25569) * 86400 * 1000));
    const local = new Date(utc.getTime() + utc.getTimezoneOffset() * 60000);
    return toLocalInput(local);
  }
  let s = String(val).trim();
  if (!s) return '';
  s = s.replace(/\//g, '-').replace(/\./g, '-').replace(/年/g, '-').replace(/月/g, '-').replace(/日/g, '');
  // Pure date (no time part) — parse as local midnight to avoid timezone shift
  if (!s.includes(':') && !s.includes('T')) {
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) {
      const local = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
      if (!isNaN(local.getTime())) return toLocalInput(local);
    }
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) return toLocalInput(d);
  return '';
}

function findColIndex(headerRow, keywords) {
  for (let i = 0; i < headerRow.length; i++) {
    const cell = String(headerRow[i] || '').trim().toLowerCase();
    for (const kw of keywords) {
      if (cell.includes(kw)) return i;
    }
  }
  return -1;
}

function openImportModal() {
  const projects = appData.projects;
  const sel = document.getElementById('importProjectSelect');
  sel.innerHTML = projects.map(p => `<option value="${p.id}"${p.id === appData.activeProjectId ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
  document.getElementById('importPreview').innerHTML = `
    <div class="import-count">✅ 识别到 ${importPendingEvents.length} 个事件</div>
    <ul>${importPendingEvents.slice(0, 20).map(ev => `<li>${esc(ev.name)} · ${fmtDT(ev.start)} → ${fmtDT(ev.end)}</li>`).join('')}${importPendingEvents.length > 20 ? '<li>…更多</li>' : ''}</ul>
  `;
  document.getElementById('importModalOverlay').classList.add('active');
}

function closeImportModal() {
  document.getElementById('importModalOverlay').classList.remove('active');
  importPendingEvents = [];
}

document.getElementById('importExcelBtn').onclick = function() {
  document.getElementById('excelFileInput').click();
};

document.getElementById('excelFileInput').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      if (!rows || rows.length === 0) { toast('⚠️ 表格为空'); return; }

      const nameKw = ['活动内容','活动名称','事件名称','事件','名称','内容','活动','title','name','event','activity'];
      const startKw = ['启动时间','开始时间','起始时间','开始日期','开始','启动','start'];
      const endKw = ['结束时间','截止时间','结束日期','结束','截止','end','deadline'];

      let headerIdx = -1, nameCol = -1, startCol = -1, endCol = -1;
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        const row = rows[i];
        const rowStr = row.map(x => String(x || '')).join(' ').toLowerCase();
        if (rowStr.includes('活动') || rowStr.includes('事件') || rowStr.includes('名称') || rowStr.includes('开始') || rowStr.includes('结束') || rowStr.includes('start') || rowStr.includes('end')) {
          nameCol = findColIndex(row, nameKw);
          startCol = findColIndex(row, startKw);
          endCol = findColIndex(row, endKw);
          if (nameCol !== -1) { headerIdx = i; break; }
        }
      }

      if (headerIdx === -1) { toast('⚠️ 未找到表头，请确认包含「活动内容」列'); return; }
      if (startCol === -1) { toast('⚠️ 未找到「启动时间/开始时间」列'); return; }
      if (endCol === -1) { toast('⚠️ 未找到「结束时间」列'); return; }

      const events = [];
      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        const name = String(row[nameCol] || '').trim();
        if (!name) continue;
        const start = parseExcelDate(row[startCol]);
        const end = parseExcelDate(row[endCol]);
        if (!start || !end) continue;
        events.push({ id: uid(), name, start, end, reminder: 1440 });
      }

      if (events.length === 0) { toast('⚠️ 未识别到有效事件，请检查日期格式'); return; }

      importPendingEvents = events;
      openImportModal();
    } catch(err) {
      toast('⚠️ 解析失败: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
};

document.getElementById('importCancelBtn').onclick = closeImportModal;
document.getElementById('importModalOverlay').onclick = function(e) { if (e.target === this) closeImportModal(); };
document.getElementById('importConfirmBtn').onclick = function() {
  const pid = document.getElementById('importProjectSelect').value;
  const project = appData.projects.find(p => p.id === pid);
  if (!project) { toast('⚠️ 请选择项目'); return; }
  project.events.push(...importPendingEvents);
  project.events.sort((a,b) => new Date(a.start) - new Date(b.start));
  saveData(); renderAll(); bindEvents(); closeImportModal();
  toast(`✅ 已导入 ${importPendingEvents.length} 个事件到「${project.name}」`);
};

// ============================================
// REMINDER CHECK
// ============================================
let notified = {};
function checkReminders() {
  if (document.body.classList.contains('mini-mode')) return;
  const now = Date.now();
  appData.projects.forEach(proj => {
    proj.events.forEach(ev => {
      const st = new Date(ev.start).getTime();
      const et = new Date(ev.end).getTime();
      const rt = st - ev.reminder*60000;

      if (now >= rt && now < rt+60000 && !notified[ev.id+'-r']) {
        notified[ev.id+'-r'] = true;
        const c = cd(ev.start);
        const msg = `「${ev.name}」将在 ${c.days}天${c.hours}时${c.mins}分后开始`;
        if (Notification.permission === 'granted') new Notification('⏰ 测试周期提醒', {body:msg});
        toast('⏰ '+msg);
      }
      if (now >= st && now < st+60000 && !notified[ev.id+'-s']) {
        notified[ev.id+'-s'] = true;
        const msg = `「${ev.name}」已开始`;
        if (Notification.permission === 'granted') new Notification('🔔 测试开始', {body:msg});
        toast('🔔 '+msg);
      }
      if (now >= et && now < et+60000 && !notified[ev.id+'-e']) {
        notified[ev.id+'-e'] = true;
        const msg = `「${ev.name}」已结束`;
        if (Notification.permission === 'granted') new Notification('✅ 测试结束', {body:msg});
        toast('✅ '+msg);
      }
      if (now < rt-120000) delete notified[ev.id+'-r'];
      if (now < st-120000) delete notified[ev.id+'-s'];
      if (now < et-120000) delete notified[ev.id+'-e'];
    });
  });
}

// ============================================
// INIT EVENT LISTENERS
// ============================================
document.getElementById('addProjectBtn').onclick = openProjectModal;
document.getElementById('miniBtn').onclick = openMini;
document.getElementById('shareBtn').onclick = function() {
  if (isShareMode) {
    // Exit share mode
    location.hash = '';
    isShareMode = false;
    loadData();
    renderAll();
    bindBatchEvents();
    var banner = document.getElementById('shareBanner');
    if (banner) banner.classList.remove('show');
    var addProject = document.getElementById('addProjectBtn');
    var batchToggle = document.getElementById('batchToggleBtn');
    var batchActions = document.getElementById('batchActions');
    var shareBtn = document.getElementById('shareBtn');
    if (addProject) addProject.style.display = '';
    if (batchToggle) batchToggle.style.display = '';
    if (batchActions && !batchMode) batchActions.style.display = 'none';
    if (shareBtn) shareBtn.textContent = '🔗 复制分享链接';
    toast('已退出分享模式');
  } else {
    copyShareLink();
  }
};

// Project modal
document.getElementById('projectModalCancelBtn').onclick = closeProjectModal;
document.getElementById('projectModalCreateBtn').onclick = confirmAddProject;
document.getElementById('projectModalOverlay').onclick = function(e) { if (e.target===this) closeProjectModal(); };
document.getElementById('projectNameInput').onkeydown = function(e) { if (e.key==='Enter') confirmAddProject(); };

// Event modal
document.getElementById('modalCancelBtn').onclick = closeEventModal;
document.getElementById('modalSaveBtn').onclick = saveEvent;
document.getElementById('modalOverlay').onclick = function(e) { if (e.target===this) closeEventModal(); };

// Theme dots
document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.onclick = function() { setTheme(this.dataset.theme); };
});

// Global keyboard
document.onkeydown = function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('projectModalOverlay').classList.contains('active')) closeProjectModal();
    else closeEventModal();
  }
  if ((e.ctrlKey||e.metaKey) && e.key==='n') { e.preventDefault(); openEventModal(null); }
};

// Notification permission
setTimeout(() => { if (Notification.permission==='default') Notification.requestPermission(); }, 3000);

// ============================================
// START
// ============================================
loadTheme();
loadShare();
loadData();
renderAll();
bindBatchEvents();
// Show share debug info if any
if (window._shareDebug) {
  var el = document.getElementById('shareDebug');
  if (el) el.textContent = '诊断: ' + window._shareDebug;
}

// Cross-window sync: listen for storage changes from mini/main window
window.addEventListener('storage', function(e) {
  if (e.key === STORAGE_KEY && e.newValue) {
    try {
      const d = JSON.parse(e.newValue);
      const remoteTs = d._ts || 0;
      // Only reload if the change came from another window (newer timestamp)
      if (remoteTs > lastSaveTime + 500) {
        loadData();
        renderAll();
        bindBatchEvents();
      }
    } catch(ex) {}
  }
});

// Periodic refresh
setInterval(() => {
  renderMain();
  bindEvents();
  checkReminders();
}, 1000);

console.log('✅ Countdown timer initialized. Projects:', appData.projects.length, 'Active:', appData.activeProjectId);
</script>
